<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ROWSPAN</h1>
    <table border="8" cellpadding="20">
        <tr>
            <td>1</td>
            <td>2</td>
            <td rowspan="2">3</td>
        </tr>
         <tr>
            <td>4</td>
            <td>5</td>
        </tr>
         <tr>
            <td>7</td>
            <td>8</td>
            <td>9</td>
        </tr>
        </table>
        <h1>COLSPAN</h1>
    <table border="8" cellpadding="20">
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
         <tr>
            <td colspan="2">4</td>
            <td>6</td>
        </tr>
         <tr>
            <td>7</td>
            <td>8</td>
            <td>9</td>
        </tr>
        </table>
    <h1> Unstructured table build</h1>
    <table border="8" cellpadding="20">
        <tr>
            <th colspan="3">number</th>
        </tr>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
         <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td>
        </tr>
         <tr>
            <td>7</td>
            <td>8</td>
            <td>9</td>
        </tr>
        </table>
        <h1> FORMATING table😁</h1>
        <table border="8" cellpadding="20">
            <caption>Numbers</caption>
            <thead>
        <tr>
            <td colspan="3">COUNT</td>
        </tr>
        </thead>
        <tbody>
            <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
         <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td>
        </tr>
         <tr>
            <td>7</td>
            <td>8</td>
            <td>9</td>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="3" align="center">total</th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
