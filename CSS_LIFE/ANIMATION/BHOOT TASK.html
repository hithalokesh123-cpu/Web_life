<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            background-color: black;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mainbox {
            width: 400px;
            height: 400px;
            border: 3px solid white;
            box-shadow: 2px 2px 13px 3px rgb(243, 242, 240);
            position: relative;
            border-radius: 50%;
            animation: Bhoot 3s infinite linear reverse;

        }

        .childbox {
            width: 70px;
            height: 70px;
            background-color: goldenrod;
            border-radius: 50%;
            position: absolute;
            top: 35px;
            box-shadow: 2px 2px 3px 3px rgb(237, 189, 67);;


        }

        @keyframes Bhoot {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>

</head>

<body>
    <div class="mainbox">
        <div class="childbox">

        </div>
    </div>


</body>

</html>
