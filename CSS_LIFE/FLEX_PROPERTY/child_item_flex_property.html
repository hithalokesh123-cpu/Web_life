<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>

    .mainCon{
         height: 550px;
        width: 900px;

         /* justify-content:space-around;  */

        /* align-items:flex-end; */

        /* #combination-justify-content,align-item */
        justify-content:flex-start;
        align-items:flex-start;
        
        gap:10px; 

        /* #flex-wrap:no-wr */
         flex-wrap:wrap;

    }
    /* #child */
    .box{
        height: 150px;
        width: 150px;
        background-color: rgb(173, 137, 92);
        border:1px solid black
     
    }

    #box5{
       order:1;
    }
     #box1{
       order:2;
    }
     #box3{

    }

       order:4;
    }

       order:5;
    } 

    /* #flex-grow:n,0(d); */
     /* #box5{
        flex-grow:2;
     }
      #box4{
        flex-grow:1;
     } */

     /* #flex-shrink:n,1(d); */
     /* #box5{

     }
     #box3{
        flex-shrink:3;
     } */

     /* #flex-basis:npx; */
      #box5{
        flex-basis:100px;
      }

     #box5{
       flex:2,2,1;
     }

     /* #align-self:center,end,start; */
    #box5{
       align-self:center;
     }
      

    </style>
</head>
<body>
   <div class="mainCon">
    <div class="box" id="box1">box1</div>
    <div class="box" id="box2">box2</div>
    <div class="box" id="box3">box3</div>
