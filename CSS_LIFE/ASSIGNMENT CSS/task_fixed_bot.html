<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .page{
            height: 100vh;
            width: 100vw;
        }
        h1{
            font-size:60px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            text-align: center;
        }
        #page1{
            background-color: rgb(95, 85, 85);
        }
         #page2{
            background-color: rgb(187, 201, 107);
        }
         #page3{
            background-color: rgb(56, 93, 95);
        }
         #page4{
            background-color: rgb(162, 103, 160);
        }
        .chatbot{
            background-color: black;
            color:aliceblue;
            height:100px;
            width:100px;
            border-radius:50%;
            position:fixed;
            bottom:20px;
            right:20px;
            text-align:center;
            background-image:url("./chatbot.gif");
            background-repeat:no-repeat;
            background-size: cover;

        }
        .textbox{
             height:100px;
            width:150px;
            border-radius:10px;
            background-color: rgb(199, 184, 164);
            position:fixed;
            bottom:20px;
            right:140px;
            text-align:center;
        }
        
    </style>
</head>
<body>
    <div class="chatbot"></div>
    <div class="textbox">Hello HITHA!!🤑 <BR>how can I help you?<br>----------------</div>
    <div class="page"id="page1"><h1>PAGE1</h1></div>
    <div class="page"id="page2"><h1>PAGE2</h1></div>
    <div class="page"id="page3"><h1>PAGE3</h1></div>
    <div class="page"id="page4"><h1>PAGE4</h1></div>
</body>
</html>
