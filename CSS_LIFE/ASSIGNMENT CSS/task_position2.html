<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0px;
            padding:0px;
            box-sizing: border-box;
        }
        .outer_container {
            height: 1000px;
            width: 1000px;
            border: 10px solid rgb(5, 41, 5);
            position: relative;
            background-color: black; 
        }
        .box{
            height:150px;
            width:150px;
            border:5px solid rgb(15, 15, 231);
            background-color: rgb(255, 251, 0);
        }
        #box1{
            position: static;
            left:300px;
        }
        #box2{
            position:absolute;
            right:0px;
            top:0px;
        }
        #box3{
            position:absolute;
            bottom: 0px;
            left:0px;

        }
        #box4{
            position:absolute;
            bottom:0px;
            right:0px;
        }


       .inner_container {
            height: 600px;
            width: 600px;
            border: 8px solid rgb(227, 11, 11);
            position:relative;
            left:20%;
            
           
        }
        .con{
            height:150px;
            width:150px;
            border:5px solid rgb(15, 15, 231);
             background-color: rgb(240, 232, 12); 

        }
        #b1{
            position: absolute;
            left:225px;
        }
        #b2{
            position:absolute;
            /* right:px; */
            top:225px;
        
        }
        #b3{
            position:absolute;
            left:225px;
            top:225px;
        }
        #b4{
            position:absolute;
            bottom:0px;
            left:225px;
        }
         #b5{
            position:absolute;
            bottom:200px;
            right:0px;
            
        }

    </style>
</head>
<body>
    <div class="outer_container">
        <div class="box" id="box1">6</div>
        <div class="box" id="box2">7</div>
        <div class="box" id="box3">8</div>
        <div class="box" id="box4">9</div>

        <div class="inner_container">
        <div class="con" id="b1">1</div>
        <div class="con" id="b2">2</div>
        <div class="con" id="b3">S</div>
        <div class="con" id="b4">3</div>
        <div class="con" id="b5">4</div>
    </div>
    </div>
</body>
</html>
