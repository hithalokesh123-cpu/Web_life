<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .container{
            height:600px;
            width:600px;
            border :6px solid rgb(6, 6, 96);
            position:relative;
        }
        .box{
            height:200px;
            width:200px;
            border:5px solid rgb(15, 15, 231);
            background-color: blue;
        }
        #box1{
            position: static;
            left:300px;
        }
        #box2{
            position:absolute;
            right:0px;
            top:0px;
        }
        #box3{
            position:absolute;
            left:200px;
        }
        #box4{
            position:absolute;
            bottom:0px;
            left:0px;
        }
         #box5{
            position:absolute;
            bottom:0px;
            right:0px;
        }

        </style>
</head>
<body>
    <div class="container">
    <div class="box" id="box1">box1</div>
    <div class="box" id="box2">box2</div>
    <div class="box" id="box3">box3</div>
    <div class="box" id="box4">box4</div>
    <div class="box" id="box5">box5</div>
   </div> 
</body>
</html>
