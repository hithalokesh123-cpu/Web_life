<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .container {
            height: 800px;
            width: 800px;
            border: 10px solid black;
            position :relative;
            background-color: rgb(233, 207, 175);
        }

        .box {
            height: 100px;
            width: 100px;
            background-color: rgb(3, 28, 45);
            border:5px solid black;
            font-size: 60px;
            font-weight:bold;
            color:white;
        }
        #box1{
            position: relative;
            left: 350px;
            top:100px;
            
        }
         #box2{
            position: absolute;
            left:600px;
            top: 200px;
        }
         #box3{
            position: relative;
            left: 100px;
            top:100px;
        }
         #box4{
            position: absolute;
             left: 600px;
             top:350px;
        }
        #box5{
            position: relative;
            left: 100px;
            top:150px;
        }
         #box6{
            position: absolute;
             left: 600px;
              top: 500px;

        }
        #box7{
            position: relative;
            left: 100px;
            top:200px;
        }
         #box8{
            position: absolute;
            left:350px;
            bottom: 100px; 
            
        }



    </style>
</head>

<body>
    <div class="container">
        <div class="box" id="box1">🤣</div>
        <div class="box" id="box2">🤑</div>
        <div class="box" id="box3">😍</div>
        <div class="box" id="box4">😎</div>
        <div class="box" id="box5">😘</div>
        <div class="box" id="box6">😍</div>
        <div class="box" id="box7">😊</div>
        <div class="box" id="box8">😶‍🌫️</div>
    </div>
</body>

</html>
